<title>Révise ta carte · Monsieur Bleu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* DA « Bouchon » : noir & blanc, boutons épais à ombre pleine, vert = juste, rouge = faux */
:root{
  --ink:#111; --paper:#fff; --soft:#f2f2f2; --mut:#6b6b6b; --line:#111; --shadow:#111;
  --ok:#2fb34f; --ok-d:#22893b; --ok-bg:#e3f7e7; --ok-ink:#1e7a35;
  --ko:#ff4f55; --ko-d:#d4353b; --ko-bg:#ffe5e6; --ko-ink:#b52a30;
  --cork:#e9b97a; --font:"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#f5f5f5; --paper:#0d0d0d; --soft:#1c1c1c; --mut:#a3a3a3; --line:#f5f5f5; --shadow:#f5f5f5;
  --ok-bg:#153a20; --ok-ink:#7be095; --ko-bg:#45181a; --ko-ink:#ff9a9e; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#f5f5f5; --paper:#0d0d0d; --soft:#1c1c1c; --mut:#a3a3a3; --line:#f5f5f5; --shadow:#f5f5f5;
  --ok-bg:#153a20; --ok-ink:#7be095; --ko-bg:#45181a; --ko-ink:#ff9a9e; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.4;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
header.top{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;align-items:center;gap:14px;padding:14px 16px 10px;border-bottom:2px solid var(--soft)}
header.top .resto{flex:1;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:14px 16px 110px;display:grid;gap:16px}
h2{font-weight:900;font-size:21px;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.btn{display:block;width:100%;text-align:center;border:2px solid var(--ink);border-radius:16px;padding:14px;font-weight:900;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--paper);background:var(--ink);box-shadow:0 5px 0 var(--mut);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mut)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shadow)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.btn.bad{background:var(--ko);border-color:var(--ko);color:#fff;box-shadow:0 5px 0 var(--ko-d)}
input[type=text],input[type=search]{font:inherit;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}
.hello{display:flex;align-items:center;gap:12px}
.bubble{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:15px;position:relative}
.bubble:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.goal{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.progress{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .35s}
.qbar .progress i{background:var(--ok)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme,.mod{background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);border-radius:18px;padding:12px;text-align:left;display:grid;gap:4px;align-content:start;transition:transform .08s,box-shadow .08s}
.theme:active,.mod:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.theme b,.mod b{font-weight:900;font-size:16px}
.theme span,.mod span{font-size:13px;color:var(--mut)}
.theme.wide{grid-column:1/-1}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--soft);filter:grayscale(1)}
.theme.wide{grid-template-columns:auto 1fr;column-gap:12px;align-items:center}.theme.wide .ic{grid-row:span 2}
.stars{font-size:13px;letter-spacing:1px}
.qbar{display:flex;align-items:center;gap:12px}
.qbar .x{background:none;border:0;font-size:24px;line-height:1;color:var(--mut);padding:4px}
.qbar .progress{flex:1}
.q{font-size:21px;font-weight:900;line-height:1.25;text-wrap:pretty}
.q em{font-style:normal;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.quote{font-size:15px;color:var(--mut);border:2px dashed var(--soft);border-radius:14px;padding:10px 12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);border-radius:16px;padding:13px 14px;font-size:16px;font-weight:700;min-height:52px;transition:transform .08s}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok-d);color:var(--ok-ink);font-weight:800}
.opt.ko{background:var(--ko-bg);border-color:var(--ko);box-shadow:0 4px 0 var(--ko-d);color:var(--ko-ink)}
.opt:disabled{cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:up .22s ease-out;max-height:70vh;overflow:auto}
.sheet>*{max-width:528px;width:100%;margin:0 auto}
.sheet.good{background:var(--ok-bg);color:var(--ok-ink)}.sheet.bad{background:var(--ko-bg);color:var(--ko-ink)}
.sheet .t{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px}
.sheet .fx{font-size:14px;display:grid;gap:4px}
.sheet .meta{color:inherit;opacity:.8}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.sheet .chip{background:rgba(255,255,255,.6)}
.done{display:grid;justify-items:center;text-align:center;gap:12px;padding-top:8px}
.done .big{font-size:30px;font-weight:900;margin:0}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.c3{border:2px solid var(--line);border-radius:16px;overflow:hidden;font-weight:900}
.c3 div:first-child{background:var(--ink);color:var(--paper);font-size:12px;padding:4px;text-transform:uppercase;letter-spacing:.06em}
.c3 div:last-child{padding:10px 4px;font-size:20px;font-variant-numeric:tabular-nums}
.c3.g{border-color:var(--ok)}.c3.g div:first-child{background:var(--ok);color:#fff}.c3.g div:last-child{color:var(--ok-ink)}
.score{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.fiche{border-top:2px solid var(--soft);padding-top:12px;display:grid;gap:6px}
.fiche:first-child{border-top:0;padding-top:0}
.fiche h3{font-weight:900;font-size:16px;margin:0;display:flex;justify-content:space-between;gap:10px}
.fiche h3 span{white-space:nowrap;font-variant-numeric:tabular-nums}
.fiche p{margin:0;font-size:14px;font-weight:600}
.meta{font-size:13px;color:var(--mut);font-weight:600}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;white-space:nowrap}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--soft);display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;max-width:110px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
nav.tabs button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6}
nav.tabs button[aria-current=true]{color:var(--ink);border-color:var(--line);background:var(--soft)}
nav.tabs button[aria-current=true] i{opacity:1}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:2px solid var(--soft);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900}
.pill.g{background:var(--ok-bg);color:var(--ok-ink)}.pill.r{background:var(--ko-bg);color:var(--ko-ink)}.pill.m{background:var(--soft);color:var(--ink)}
.note{font-size:13px;color:var(--mut)}
.mods{display:grid;gap:12px}
.mod{display:flex;align-items:center;gap:12px;width:100%}
.mod div{flex:1;min-width:0;display:grid;gap:2px}
.mod .st{flex:0 0 auto}
.lesson h3{font-weight:900;font-size:17px;margin:0}
.lesson p{margin:0;font-size:15px;font-weight:600}
.lesson ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
.backbtn{background:none;border:0;padding:4px 0;font-size:15px;font-weight:900;text-align:left;justify-self:start}
.flash{background:var(--paper);border:2px solid var(--line);box-shadow:0 6px 0 var(--shadow);border-radius:22px;min-height:280px;padding:22px 18px;display:grid;align-content:center;gap:10px;text-align:center;width:100%}
.flash .big{font-weight:900;font-size:25px;text-wrap:balance}
.flash .hint{font-size:13px;color:var(--mut)}
.flash p{margin:0;font-size:15px;text-align:left;font-weight:600}
.lhead{display:flex;align-items:center;gap:12px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hop{animation:hop 1.4s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><span class="resto" id="resto">Monsieur Bleu</span><span class="stat" title="Jours d'affilée">🔥 <span id="streak">0</span></span><span class="stat" title="Points d'expérience">💎 <span id="xp">0</span></span></header>

<main>
  <section id="v-quiz">
    <div id="home" style="display:grid;gap:16px">
      <div class="hello"><svg class="hop" width="86" height="100" aria-hidden="true"><use href="#bouchon"/></svg><div class="bubble" id="hi">Salut ! Moi c'est Bouchon. On révise la carte ?</div></div>
      <div class="goal" id="goal"></div>
      <div class="panel" id="who">
        <label for="name" class="eyebrow">Ton prénom</label>
        <div class="row"><input id="name" type="text" autocomplete="given-name" placeholder="ex. Camille"><button class="btn ghost" id="saveName" style="flex:0 0 auto">OK</button></div>
        <div class="note" id="whoNote">Il sert à suivre tes scores.</div>
      </div>
      <div>
        <h2 style="margin-bottom:12px">Ta carte</h2>
        <div class="themes" id="themes"></div>
      </div>
      <div class="panel" id="mine" hidden><h2>Mes derniers scores</h2><div id="mineList"></div></div>
    </div>
    <div id="play" hidden style="display:grid;gap:14px"></div>
  </section>

  <section id="v-learn" hidden style="display:grid;gap:12px"></section>

  <section id="v-fiches" hidden style="display:grid;gap:12px">
    <input id="search" type="search" placeholder="Chercher un plat, un ingrédient, un allergène…">
    <div class="filters" id="ffil"></div>
    <div class="panel" id="ficheList"></div>
  </section>

  <section id="v-suivi" hidden style="display:grid;gap:12px">
    <div class="panel">
      <h2>Suivi de l'équipe</h2>
      <div id="suiviBody" class="note">Chargement…</div>
    </div>
    <div class="panel" id="suiviDetail" hidden></div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="quiz" aria-current="true"><i>🏠</i>Jouer</button>
  <button data-v="learn"><i>📚</i>Apprendre</button>
  <button data-v="fiches"><i>🔎</i>Fiches</button>
  <button data-v="suivi" id="tabSuivi" hidden><i>🏆</i>Suivi</button>
</nav>

<script>
// Réglages de l'appli. Pour un autre restaurant du groupe, l'ajouter dans RESTAURANTS.
const RESTAURANT='Monsieur Bleu';            // restaurant par défaut
const RESTAURANTS=['Monsieur Bleu'];         // liste proposée à la création de compte
const ADMINS=[];                             // e-mails des administrateurs (voient tout, nomment les managers)
const FIREBASE=null;                         // coller ici la config web Firebase ({apiKey:..., authDomain:..., projectId:..., appId:...})
const SHEET_URL='';                          // facultatif : envoi des scores vers un Google Sheet

// Envoi des scores vers le Google Sheet des managers, avec file d'attente hors ligne.
const DEVICE=(()=>{try{let d=localStorage.getItem('mb-device');if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem('mb-device',d)}return d}catch{return '?'}})();
function sheetQueue(){try{return JSON.parse(localStorage.getItem('mb-pending')||'[]')}catch{return[]}}
function flushSheet(){if(!SHEET_URL)return;const q=sheetQueue();if(!q.length)return;
  Promise.all(q.map(a=>fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(a)})))
    .then(()=>{try{localStorage.setItem('mb-pending','[]')}catch{}}).catch(()=>{})}
function sendSheet(att){if(!SHEET_URL)return;const row={...att,restaurant:RESTAURANT,name:playerName(),device:DEVICE,errors:(att.errors||[]).map(w=>w.q+' -> '+w.a).join(' | ')};
  const q=sheetQueue();q.push(row);try{localStorage.setItem('mb-pending',JSON.stringify(q.slice(-200)))}catch{};flushSheet()}
addEventListener('online',flushSheet);flushSheet();

<script type="application/json" id="vins">{"modules": [{"id": "alsace", "titre": "Alsace", "sous": "Blancs aromatiques, vins de cépage", "source": "Alsace.pdf", "sections": [{"t": "Où ?", "p": "Haut-Rhin au sud, Bas-Rhin au nord. Le vignoble s'étire entre le massif des Vosges et l'Ill, de Mulhouse à Strasbourg : 100 km de long sur 2 à 4 km de large."}, {"t": "Climat et sols", "p": "Climat semi-continental. Les Vosges protègent des influences océaniques : la pluviométrie est parmi les plus faibles de France. Vignes exposées sud, sud-est. Sols très variés : granit, calcaire, marne, schiste, argile, grès."}, {"t": "Cépages", "l": ["Nobles : riesling, gewurztraminer, muscat, pinot gris", "Aussi : sylvaner, pinot blanc (ou klevner), pinot noir", "Plus rares : chasselas, auxerrois"]}, {"t": "La particularité", "p": "En Alsace, le vin se vend sous le nom de son cépage. Trois appellations : AOC Alsace, AOC Alsace Grand Cru et Crémant d'Alsace. « Edelzwicker » ou « Gentil » désigne un assemblage de plusieurs cépages blancs. Le Grand Cru n'autorise que riesling, gewurztraminer, pinot gris et muscat. Deux mentions pour les cépages nobles : Vendanges Tardives (VT) et Sélection de Grains Nobles (SGN)."}, {"t": "Les vins et leurs accords", "l": ["Sylvaner : fruité, frais, parfois perlant. Coquillages, terrines de poisson, escargots, quiches. 8 à 10 °C.", "Pinot blanc : souple, bouquet léger. Crustacés, coquillages, terrines de poisson. 8 à 10 °C.", "Riesling : blanc sec, fin et racé. Poissons grillés ou au beurre, volaille en sauce, munster. 8 à 10 °C.", "Gewurztraminer : corsé, bouquet de litchi. Munster, poissons. En vendanges tardives : foie gras, dessert ou apéritif. 8 à 10 °C.", "Muscat : sec et fruité. Apéritif, asperges. 8 à 10 °C.", "Pinot gris : souple, capiteux. Viandes blanches (porc, veau rôti). 10 à 12 °C.", "Pinot noir : rouges et rosés légers, servis frais. Viandes rouges rôties. 10 à 12 °C.", "Crémant d'Alsace : méthode traditionnelle, surtout pinot blanc. Apéritif ou dessert. 5 à 7 °C."]}]}, {"id": "bordeaux", "titre": "Bordeaux", "sous": "Grands rouges d'assemblage et liquoreux", "source": "Bordeaux.pdf", "sections": [{"t": "Où ?", "p": "Gironde. Le vignoble est entouré de grandes masses d'eau (océan Atlantique, estuaire de la Gironde, Garonne, Dordogne) et protégé par la forêt de pins, qui régule la température."}, {"t": "Histoire", "p": "Déjà présent avant les Romains. Au Moyen Âge, Bordeaux est un port anglais : les vins partent vers l'Angleterre et les Pays-Bas. En 1855, la chambre de commerce classe officiellement les grands vins : ce classement est toujours en vigueur."}, {"t": "Climat et sols", "p": "Océanique, adouci par la forêt et l'eau. Sols : graves (silice, quartz, petits galets) dans le Médoc, silice sur argilo-calcaire à Sauternes et Barsac, marnes et calcaires dans l'Entre-Deux-Mers."}, {"t": "Cépages", "l": ["Rouges : merlot, cabernet-sauvignon, cabernet franc, malbec (ou côt), petit verdot, carmenère", "Blancs : sauvignon, sémillon, muscadelle"]}, {"t": "Les appellations", "l": ["Régionales : Bordeaux, Bordeaux supérieur, Crémant de Bordeaux", "Sous-régionales : Médoc, Haut-Médoc, Graves, Entre-Deux-Mers…", "Communales du Médoc : Saint-Estèphe, Pauillac, Saint-Julien, Listrac-Médoc, Moulis, Margaux", "Rive droite : Saint-Émilion, Pomerol, Fronsac, Côtes de Castillon, Côtes de Bourg, Blaye", "Liquoreux : Sauternes, Barsac, Cérons, Loupiac, Cadillac, Sainte-Croix-du-Mont"]}, {"t": "Le classement de 1855", "p": "61 crus rouges (60 du Médoc et 1 des Graves). Les 5 premiers crus : Haut-Brion, Lafite-Rothschild, Latour, Margaux, Mouton-Rothschild. Pour les liquoreux, un seul Premier cru supérieur : Château d'Yquem (Sauternes). Pétrus, à Pomerol, n'est pas classé mais reste une référence mondiale. « Mis en bouteille au château » garantit que le vin a été embouteillé à la propriété."}, {"t": "Les vins et leurs accords", "l": ["Rouges : cassis, mûre, grande finesse. Saint-Émilion et Graves plus souples que le Médoc. Viandes rouges, petit gibier, volaille. 16 à 18 °C.", "Blancs secs : Graves blancs (sauvignon pour la nervosité, sémillon pour la richesse). Poissons. Entre-Deux-Mers plus vif : fruits de mer. 9 à 11 °C.", "Liquoreux : raisins atteints de pourriture noble (Botrytis cinerea), vendangés grain par grain en tries successives. Fruits confits, miel, acacia. Très longue garde.", "Mousseux : Crémant de Bordeaux, méthode traditionnelle. 6 à 8 °C.", "Autour du vin : la Fine Bordeaux (eau-de-vie) et le Lillet (apéritif à base de vin)."]}]}, {"id": "bourgogne", "titre": "Bourgogne", "sous": "Pinot noir, chardonnay et climats", "source": "Bourgogne.pdf", "sections": [{"t": "Où ?", "p": "Yonne, Côte-d'Or, Saône-et-Loire et Rhône. Le vignoble s'étend sur 200 km de Dijon à Lyon, parfois très étroit (800 m pour la Côte de Nuits). Le Beaujolais en fait partie."}, {"t": "Histoire", "p": "Ce sont les moines de Cîteaux qui ont développé le vignoble. En 1395, Philippe le Hardi interdit le gamay, jugé moins qualitatif que le pinot noir. Depuis 1859, les Hospices de Beaune organisent leur vente aux enchères."}, {"t": "Climat et sols", "p": "Climat continental : hivers froids, gelées tardives, étés chauds. Calcaire au nord, argilo-siliceux au sud. Chablis repose sur un sol kimméridgien (marnes calcaires)."}, {"t": "Cépages", "l": ["Pinot noir pour les rouges", "Chardonnay pour les blancs", "Aussi : aligoté, gamay (Passe-tout-grains), et sauvignon uniquement à Saint-Bris"]}, {"t": "La pyramide des appellations", "l": ["Générique et régionales : Bourgogne, Bourgogne aligoté, Passe-tout-grains (pinot + gamay), Crémant de Bourgogne", "Sous-régionales : Chablis, Côte de Nuits-Villages, Côte de Beaune-Villages, Mâcon-Villages…", "Communales : le nom du village, par exemple Pommard", "Premiers crus : village + « premier cru » + nom du climat (ex. Vougeot 1er cru Les Petits Vougeots)", "Grands crus : seul le nom du climat + « grand cru » (ex. Chambertin, à Gevrey-Chambertin)"]}, {"t": "Les vins et leurs accords", "l": ["Rouges : la référence mondiale du pinot noir, petits fruits rouges. Grands crus : gibier. Les autres : volaille (coq au vin), bœuf grillé. 14 à 16 °C.", "Blancs : Montrachet et Chablis grands crus, notes de beurre frais, noisette, amande. Poissons nobles, volaille à la crème, foie gras. Les autres : escargots, andouillette. 10 à 12 °C.", "Crémant de Bourgogne : pinot noir et chardonnay, méthode traditionnelle. Desserts. 6 à 8 °C."]}]}, {"id": "champagne", "titre": "Champagne", "sous": "Assemblage, prise de mousse, dosage", "source": "Champagne.pdf", "sections": [{"t": "Où ?", "p": "Marne, Aube et Aisne. Cinq zones : Montagne de Reims, Vallée de la Marne, Côte des Blancs, Coteaux du Sézannais, vignoble de l'Aube."}, {"t": "Climat et sol", "p": "À la limite nord de la culture de la vigne (10 °C de moyenne annuelle). Le sous-sol de craie retient l'eau et restitue la chaleur : il donne de la finesse, surtout au chardonnay."}, {"t": "Trois cépages", "l": ["Pinot noir", "Pinot meunier", "Chardonnay"]}, {"t": "Les mentions à connaître", "l": ["Blanc de blancs : uniquement des raisins blancs (chardonnay)", "Millésimé : vin d'une seule grande année. Non millésimé : assemblage de plusieurs années", "NM : négociant manipulant, achète les raisins et élabore", "RM : récoltant manipulant, élabore uniquement avec sa propre récolte", "CM : coopérative de manipulation", "Autres appellations : Coteaux champenois (vins tranquilles, comme le rouge de Bouzy) et Rosé des Riceys"]}, {"t": "Comment on le fait", "p": "Méthode champenoise : une première fermentation en cuve donne un vin tranquille, puis on ajoute sucre et levures à la mise en bouteille pour la seconde fermentation (prise de mousse). Après le remuage, on dégorge pour retirer le dépôt, puis on ajoute la liqueur d'expédition : c'est le dosage qui fait un extra-brut, un brut ou un demi-sec. La Champagne est la seule AOC française où le rosé d'assemblage (vin blanc + vin rouge) est autorisé."}, {"t": "Au service", "l": ["Température : 6 à 8 °C", "Servir en flûte : la coupe disperse les arômes", "On ne givre jamais une flûte : cela casse le goût", "Brut ou blanc de blancs à l'apéritif et sur les entrées de poisson ; millésimé sur tout un repas ; rosé sur viande blanche ou dessert aux fruits rouges ; demi-sec au dessert"]}]}, {"id": "loire", "titre": "Val de Loire", "sous": "Sauvignon, chenin, cabernet franc", "source": "Val de Loire.pdf", "sections": [{"t": "Où ?", "p": "Le long de la Loire, quatre grands secteurs : Pays nantais, Anjou-Saumur, Touraine et Centre (Sancerre, Pouilly)."}, {"t": "Climat", "p": "Océanique et doux à l'ouest (Pays nantais, Anjou, Touraine), plus rude dans le Centre avec des gelées de printemps. L'humidité d'automne en Anjou favorise la pourriture noble."}, {"t": "Les vins et leurs accords", "l": ["Rouges : Chinon, Bourgueil, Saint-Nicolas-de-Bourgueil, Saumur-Champigny, Anjou-Villages. Surtout du cabernet franc : violette, iris, fraise. Volaille, veau. 14 à 16 °C.", "Sancerre et Pouilly-Fumé : la référence du sauvignon, agrumes et acacia. Poissons nobles (brochet au beurre blanc).", "Muscadet (Pays nantais) : citron, frais et nerveux. Huîtres, moules, langoustines. Le Gros-Plant, plus acide : fruits de mer.", "Chenin : Savennières, Saumur, Vouvray (andouillette au Vouvray). Cour-Cheverny : cépage romorantin.", "Moelleux : Quarts-de-Chaume, Bonnezeaux, en chenin botrytisé. Foie gras ou apéritif. 7 à 8 °C.", "Crémant de Loire : chenin, chardonnay, cabernets. 6 à 8 °C.", "Rosés : Cabernet d'Anjou et Rosé d'Anjou, demi-secs. 9 à 12 °C.", "Menetou-Salon rouge : pinot noir, proche des Bourgognes."]}]}], "cepages": [{"nom": "Chardonnay", "couleur": "blanc", "origine": "Nom tiré d'un village du Mâconnais ; Bourgogne et Champagne en revendiquent l'origine.", "aires": "Partout dans le monde. En Champagne, vinifié seul il donne le Blanc de blancs.", "aromes": "Acacia, amande, beurre frais, brioche, noisette grillée, miel, pierre à fusil, agrumes"}, {"nom": "Sauvignon", "couleur": "blanc", "origine": "Val de Loire (introduit dans le Cher par les Bénédictins) ou Sud-Ouest.", "aires": "Sancerre, Pouilly-Fumé, Menetou-Salon, Quincy, Reuilly, Saint-Bris ; Sauternes et Barsac en assemblage.", "aromes": "Agrumes, buis, bourgeon de cassis, fruit de la passion, pierre à fusil, poivron vert"}, {"nom": "Pinot noir", "couleur": "rouge", "origine": "Bourgogne, sa vraie patrie ; déjà cultivé en Gaule à l'époque romaine.", "aires": "Bourgogne surtout, Champagne, Alsace ; aussi Nouvelle-Zélande, USA, Allemagne.", "aromes": "Cerise, framboise, griotte, fraise ; avec l'âge sous-bois, champignon, cuir, truffe"}, {"nom": "Merlot", "couleur": "rouge", "origine": "Bordelais. Majoritaire à Pétrus.", "aires": "Pomerol et la rive droite (Saint-Émilion), Graves, Bergerac, Cahors.", "aromes": "Petits fruits rouges, cerise, mûre ; avec l'âge cuir, humus, sous-bois"}, {"nom": "Cabernet sauvignon", "couleur": "rouge", "origine": "Bordelais. Majoritaire à Lafite-Rothschild.", "aires": "Médoc et Graves surtout, et dans le monde entier.", "aromes": "Cassis, cèdre, réglisse, violette ; poivron vert si le raisin manque de maturité"}, {"nom": "Cabernet franc", "couleur": "rouge", "origine": "Bordelais, comme le cabernet sauvignon. Majoritaire à Cheval Blanc.", "aires": "Loire surtout (Chinon, Bourgueil, Saumur-Champigny), Libournais.", "aromes": "Fruits rouges (fraise, framboise), épices, poivron mûr, herbes"}, {"nom": "Syrah", "couleur": "rouge", "origine": "Incertaine : Syracuse ou Shiraz selon les légendes.", "aires": "Rhône nord en monocépage : Côte-Rôtie, Hermitage, Cornas, Saint-Joseph, Crozes-Hermitage. Aussi Australie (Shiraz).", "aromes": "Violette, cerise, framboise, poivre, garrigue ; avec l'âge tabac, réglisse, truffe"}], "service": [{"t": "Températures de service", "l": ["Champagne : 6 à 10 °C", "Blanc : 9 à 13 °C", "Rouge : 16 à 18 °C", "Il est plus facile de rafraîchir un vin (seau d'eau et de glace) que de le réchauffer."]}, {"t": "Décanter ou carafer ?", "l": ["Décanter : transvaser un vin vieux en laissant le dépôt dans la bouteille. On s'aide d'une bougie pour voir le dépôt arriver à l'épaule et on s'arrête. La bougie ne sert pas à chauffer le vin.", "Carafer : verser un vin jeune en carafe pour l'aérer et l'assagir. Utile pour les vins puissants ou fermés.", "Éviter les carafes trop larges (oxydation trop rapide), fragiles ou difficiles à nettoyer."]}, {"t": "Verrerie", "p": "Les verres doivent être transparents, incolores et le plus fins possible. Il suffit d'un verre à eau, d'une flûte et de 2 ou 3 tailles de verres à vin. Un verre propre ne se remarque pas, un verre sale se voit immédiatement."}, {"t": "Bouchons", "p": "Un vin « bouchonné » vient d'une moisissure qui produit le TCA (trichloroanisole), une odeur forte et désagréable. Alternatives au liège naturel : synthétique, liège traité ou aggloméré, capsule à vis, bouchon en verre."}, {"t": "Vinification", "l": ["Le vin blanc peut se faire avec du raisin blanc ou du raisin noir à jus blanc.", "Le vin rouge se fait uniquement avec du raisin noir : la couleur vient de la macération des peaux.", "Rosé de presse : macération rapide des peaux au pressurage.", "Rosé de saignée : macération plus longue, on « saigne » une cuve de rouge.", "Rosé d'assemblage : mélange de blanc et de rouge, autorisé seulement en Champagne."]}, {"t": "Assemblages célèbres", "l": ["Lafite-Rothschild : cabernet sauvignon majoritaire", "Pétrus : merlot majoritaire", "Cheval Blanc : cabernet franc majoritaire", "Châteauneuf-du-Pape autorise 13 cépages, le record en AOC"]}, {"t": "Formats de bouteilles", "l": ["Demi-bouteille : 37,5 cl", "Clavelin : 62 cl (Jura)", "Bouteille : 75 cl", "Magnum : 1,5 L (2 bouteilles)", "Jéroboam : 3 L (4 bouteilles)", "Réhoboam : 4,5 L (6 bouteilles)", "Mathusalem : 6 L (8 bouteilles)", "Salmanazar : 9 L (12 bouteilles)", "Balthazar : 12 L (16 bouteilles)", "Nabuchodonosor : 15 L (20 bouteilles)", "Melchior : 18 L (24 bouteilles)", "Plus la bouteille est grande, plus le vin vieillit lentement."]}], "degust": [{"t": "Les 4 temps de la dégustation", "l": ["L'œil (le visuel)", "Le nez (l'olfactif)", "La bouche (le gustatif)", "Le temps de réflexion"]}, {"t": "L'œil", "p": "On observe la couleur et ses reflets, la limpidité, l'intensité, les larmes (ou jambes) et l'épaisseur du disque. Blancs : du jaune-vert à l'ambré. Rouges : du cerise et rubis (jeunes) au grenat et tuilé (évolués)."}, {"t": "Le nez : les familles d'arômes", "l": ["Florale : acacia, rose, violette, pivoine", "Fruitée : abricot, cerise, citron, framboise, poire", "Végétale : fougère, menthe, tabac", "Minérale : craie, pierre à fusil, silex", "Épicée : anis, cannelle, gingembre, poivre", "Empyreumatique : brûlé, grillé, toasté, torréfié", "Animale : ambre, cuir, musc", "Balsamique : camphre, résine de pin, vanille", "Chimique : cire, éther, hydrocarbures"]}, {"t": "La bouche", "p": "On décrit l'attaque, le volume, la longueur et la finale. La longueur se mesure en caudalies : 1 caudalie = 1 seconde de persistance des arômes après avoir avalé ou recraché."}], "lexique": [{"mot": "Acerbe", "def_": "Se dit d'un vin rendu âpre et vert par un fort excès de tanin et d'acidité."}, {"mot": "Aimable", "def_": "Vin dont tous les aspects sont agréables et pas trop marqués."}, {"mot": "Ample", "def_": "Vin harmonieux qui occupe pleinement et longuement la bouche."}, {"mot": "Astringence", "def_": "Caractère un peu âpre et rude en bouche, souvent présent dans les jeunes vins rouges."}, {"mot": "Brut", "def_": "Vin effervescent comportant très peu de sucre."}, {"mot": "Capiteux", "def_": "Vin très riche en alcool, jusqu'à en être fatigant."}, {"mot": "Caudalie", "def_": "Unité de mesure de la persistance des arômes en bouche : 1 seconde."}, {"mot": "Charnu", "def_": "Vin qui a de la chair, du corps, avec une certaine suavité."}, {"mot": "Charpenté", "def_": "Vin bien constitué, à dominante tannique, bon pour le vieillissement."}, {"mot": "Court", "def_": "Vin qui laisse peu de trace en bouche après la dégustation."}, {"mot": "Dosage", "def_": "Apport de sucre (liqueur d'expédition) à un champagne après le dégorgement."}, {"mot": "Empyreumatique", "def_": "Famille d'odeurs de cuit, de grillé, de fumé, de torréfaction."}, {"mot": "Équilibré", "def_": "Vin dont l'acidité, le moelleux (et le tanin pour un rouge) sont de forces égales."}, {"mot": "Fermé", "def_": "Vin jeune qui n'a pas encore développé son bouquet et qu'il faut attendre."}, {"mot": "Fondu", "def_": "Vin, souvent vieux, dont les caractères se mêlent harmonieusement."}, {"mot": "Frais", "def_": "Vin légèrement acide, sans excès, qui donne une sensation de fraîcheur."}, {"mot": "Friand", "def_": "Vin à la fois frais et fruité."}, {"mot": "Garde", "def_": "Vin qui montre une bonne aptitude au vieillissement."}, {"mot": "Gras", "def_": "Synonyme d'onctueux."}, {"mot": "Larmes", "def_": "Traces laissées sur les parois du verre quand on l'agite."}, {"mot": "Liquoreux", "def_": "Vin blanc riche en sucre, issu de raisins atteints de pourriture noble."}, {"mot": "Long", "def_": "Vin dont les arômes persistent longtemps en bouche."}, {"mot": "Moelleux", "def_": "Vin blanc doux, entre le sec et le liquoreux."}, {"mot": "Nerveux", "def_": "Vin marqué par une pointe d'acidité, sans excès."}, {"mot": "Pétillant", "def_": "Vin dont la mousse est moins forte que celle d'un mousseux."}, {"mot": "Piqué", "def_": "Vin atteint d'acescence, avec une odeur aigre de vinaigre."}, {"mot": "Rond", "def_": "Vin dont la souplesse et la chair donnent une impression de rondeur."}, {"mot": "Souple", "def_": "Vin coulant où le moelleux l'emporte sur l'astringence."}, {"mot": "Tannique", "def_": "Vin qui laisse une note d'astringence due à sa richesse en tanin."}, {"mot": "Tanin", "def_": "Substance du raisin qui donne au vin sa capacité de garde."}, {"mot": "Tranquille", "def_": "Vin non effervescent."}, {"mot": "Vif", "def_": "Vin frais et léger, à petite dominante acide."}], "questions": [{"m": "alsace", "q": "Sous quel nom se vend le plus souvent un vin d'Alsace ?", "a": "Le nom de son cépage", "d": ["Le nom du château", "Le nom du village uniquement", "Le nom du négociant"], "e": "La particularité de l'Alsace : riesling, gewurztraminer, pinot gris…"}, {"m": "alsace", "q": "Quel massif protège le vignoble alsacien des influences océaniques ?", "a": "Les Vosges", "d": ["Le Jura", "Les Alpes", "Le Massif central"], "e": "Grâce aux Vosges, l'Alsace a l'une des plus faibles pluviométries de France."}, {"m": "alsace", "q": "Quel vin d'Alsace a un bouquet qui rappelle le litchi ?", "a": "Gewurztraminer", "d": ["Riesling", "Sylvaner", "Pinot blanc"], "e": "Le gewurztraminer est corsé, très aromatique, avec des notes de litchi."}, {"m": "alsace", "q": "Quel vin d'Alsace proposer avec le foie gras ?", "a": "Gewurztraminer vendanges tardives", "d": ["Sylvaner", "Pinot noir", "Crémant d'Alsace"], "e": "Le gewurztraminer VT est le classique avec le foie gras."}, {"m": "alsace", "q": "Que signifie « Edelzwicker » sur une étiquette alsacienne ?", "a": "Un assemblage de plusieurs cépages blancs", "d": ["Un grand cru", "Un vin de vendanges tardives", "Un vin effervescent"], "e": "Edelzwicker ou Gentil = assemblage de cépages blancs."}, {"m": "alsace", "q": "Lequel de ces cépages n'est PAS autorisé en Alsace Grand Cru ?", "a": "Sylvaner", "d": ["Riesling", "Gewurztraminer", "Muscat"], "e": "Selon le support : riesling, gewurztraminer, pinot gris et muscat."}, {"m": "alsace", "q": "Que veut dire SGN ?", "a": "Sélection de Grains Nobles", "d": ["Sélection Grand Négoce", "Sec Grand Nectar", "Seconde Gamme Nationale"], "e": "Mention réservée aux cépages nobles, avec les Vendanges Tardives (VT)."}, {"m": "alsace", "q": "À quelle température servir un Crémant d'Alsace ?", "a": "5 à 7 °C", "d": ["10 à 12 °C", "14 à 16 °C", "16 à 18 °C"], "e": "Comme tous les effervescents, bien frais."}, {"m": "alsace", "q": "Quel vin d'Alsace conseiller avec des asperges om": "Miss", "alcool": false, "prix": "15 €", "ingredients": ["4 cl Seedlip", "2 cl cordial mûre", "2 cl eau de pomette", "8 feuilles de sauge"], "verre": "Verre à cocktail", "garnish": "Pomette", "glace": "Sans glace", "methode": "Shaker", "details": "Seedlip : distillat botanique sans alcool.", "notes": "Fruité et végétal, notes de mûre et de pomme, finale herbacée", "origine": "Répond à LADY ; sa version sans alcool."}, {"nom": "Curly", "alcool": false, "prix": "15 €", "ingredients": ["12 cl batch ELIO"], "verre": "Tumbler", "garnish": "Rim poudre d'hibiscus acidifiée", "glace": "Long ice", "methode": "Direct", "details": "Batch ELIO : hibiscus, rose et cardamome, rectifiée à l'acide citrique.", "notes": "Floral et acidulé, notes de cardamome, finale aromatique", "origine": "Les boucles de Shirley Temple ; version sans alcool de SHIRLEY."}]}</script>
<script>
const CARTE = JSON.parse(document.getElementById('carte').textContent);
const FOOD = CARTE.food.map((d,i)=>({...d,id:'f'+i}));
const CKT = CARTE.cocktails.map((d,i)=>({...d,id:'c'+i}));
const VINS = JSON.parse(document.getElementById('vins').textContent);
const WMOD = {alsace:'Alsace',bordeaux:'Bordeaux',bourgogne:'Bourgogne',champagne:'Champagne',loire:'Val de Loire',cepages:'Cépages',service:'Service du vin',degust:'Dégustation',lexique:'Lexique'};
const ALL_ALLERG = [...new Set(FOOD.flatMap(d=>d.allergenes))];
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = a=>a[Math.random()*a.length|0];
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const group = d=>d.cat.startsWith('Desserts')?'Desserts':d.cat.startsWith('Plats')||d.cat.startsWith('À partager')?'Plats':d.cat;
const allergTxt = l=>l.length?l.join(', '):'Aucun allergène majeur';

// ---------- question builders: each returns {key, q, quote?, opts, answer, item, kind} ----------
function mk(key,q,answer,distract,item,kind,quote){
  const opts = shuffle([answer,...shuffle([...new Set(distract)].filter(x=>x!==answer)).slice(0,3)]);
  if(opts.length<3) return null;
  return {key,q,quote,opts,answer,item,kind};
}
const B = {
  prixFood(){const d=pick(FOOD);return mk('pf'+d.id,`Quel est le prix de <em>${esc(d.nom)}</em> ?`,d.prix,shuffle(FOOD.filter(x=>group(x)===group(d))).map(x=>x.prix),d,'Prix')},
  prixCkt(){const d=pick(CKT);return mk('pc'+d.id,`Quel est le prix du cocktail <em>${esc(d.nom)}</em>${d.alcool?'':' (sans alcool)'} ?`,d.prix,['15 €','18 €','22 €','24 €','19 €'],d,'Prix')},
  grammage(){const d=pick(FOOD.filter(x=>x.poids));return mk('gr'+d.id,`Quel est le grammage de <em>${esc(d.nom)}</em> ?`,d.poids,['120 g','140 g','160 g','180 g','200 g','250 g'],d,'Composition')},
  descToNom(){const d=pick(FOOD.filter(x=>x.compo.length>40));return mk('dn'+d.id,`Quel plat correspond à cette description ?`,d.nom,FOOD.filter(x=>group(x)===group(d)).map(x=>x.nom),d,'Composition',d.compo)},
  mep(){const d=pick(FOOD.filter(x=>x.mep));return mk('mp'+d.id,`Quelle est la mise en place pour <em>${esc(d.nom)}</em> ?`,d.mep,FOOD.filter(x=>x.mep).map(x=>x.mep),d,'Mise en place')},
  allergListe(){const d=pick(FOOD);const a=d.allergenes;const others=ALL_ALLERG.filter(x=>!a.includes(x));
    const variants=[];
    for(let k=0;k<8;k++){let v=[...a];const r=Math.random();
      if(r<.4&&others.length) v.push(pick(others));
      else if(r<.75&&v.length) v.splice(Math.random()*v.length|0,1);
      else if(v.length&&others.length){v.splice(Math.random()*v.length|0,1,pick(others))}
      else v.push(pick(others));
      variants.push(allergTxt(ALL_ALLERG.filter(x=>v.includes(x))));}
    return mk('al'+d.id,`Quels allergènes contient <em>${esc(d.nom)}</em> ?`,allergTxt(ALL_ALLERG.filter(x=>a.includes(x))),variants,d,'Allergènes')},
  allergPresent(){const d=pick(FOOD.filter(x=>x.allergenes.length));return mk('ap'+d.id,`Lequel de ces allergènes est présent dans <em>${esc(d.nom)}</em> ?`,pick(d.allergenes),ALL_ALLERG.filter(x=>!d.allergenes.includes(x)),d,'Allergènes')},
  platAvec(){const a=pick(ALL_ALLERG);const avec=FOOD.filter(x=>x.allergenes.includes(a)&&!x.cat.startsWith('Garnitures'));const sans=FOOD.filter(x=>!x.allergenes.includes(a)&&!x.cat.startsWith('Garnitures'));if(!avec.length||sans.length<3)return null;const d=pick(avec);
    return mk('pa'+a+d.id,`Un client est allergique : <em>${esc(a)}</em>. Quel plat doit-il éviter ?`,d.nom,sans.filter(x=>group(x)===group(d)).concat(shuffle(sans)).map(x=>x.nom),d,'Allergènes')},
  platSans(){const a=pick(ALL_ALLERG);const avec=FOOD.filter(x=>x.allergenes.includes(a)&&!x.cat.startsWith('Garnitures'));const sans=FOOD.filter(x=>!x.allergenes.includes(a)&&!x.cat.startsWith('Garnitures'));if(avec.length<3||!sans.length)return null;const d=pick(sans);
    return mk('ps'+a+d.id,`Lequel de ces plats ne contient <em>pas</em> l'allergène <em>${esc(a)}</em> ?`,d.nom,shuffle(avec).map(x=>x.nom),d,'Allergènes')},
  cktIngr(){const d=pick(CKT);const ing=pick(d.ingredients);const base=ing.replace(/^[\d,]+\s*(cl|dash|feuilles de)?\s*/i,'');
    const ok=CKT.filter(x=>x.ingredients.some(i=>i.includes(base)));if(ok.length>1)return null;
    return mk('ci'+d.id+base,`Quel cocktail contient <em>${esc(ing)}</em> ?`,d.nom,CKT.map(x=>x.nom),d,'Cocktails')},
  cktVerre(){const d=pick(CKT);return mk('cv'+d.id,`Dans quel verre sert-on le <em>${esc(d.nom)}</em> ?`,d.verre,CKT.map(x=>x.verre).concat(['Coupe','Highball']),d,'Cocktails')},
  cktGarnish(){const d=pick(CKT);return mk('cg'+d.id,`Quel est le garnish du <em>${esc(d.nom)}</em> ?`,d.garnish,CKT.map(x=>x.garnish).concat(['Zeste d\'orange']),d,'Cocktails')},
  cktMethode(){const d=pick(CKT);return mk('cm'+d.id,`Quelle méthode pour le <em>${esc(d.nom)}</em> ?`,d.methode,['Shaker','Verre à mélange','Direct','Blender'],d,'Cocktails')},
  cktGlace(){const d=pick(CKT);return mk('cgl'+d.id,`Quelle glace pour le <em>${esc(d.nom)}</em> ?`,d.glace,['Cube ice','Long ice','Sans glace','Glace pilée'],d,'Cocktails')},
  cktSans(){const d=pick(CKT.filter(x=>!x.alcool));return mk('cs'+d.id,`Lequel de ces cocktails est <em>sans alcool</em> ?`,d.nom,CKT.filter(x=>x.alcool).map(x=>x.nom),d,'Cocktails')},
  cktJumeau(){const pairs={Kaori:'Koko',Lady:'Miss',Shirley:'Curly'};const k=pick(Object.keys(pairs));const d=CKT.find(x=>x.nom===pairs[k]);
    return mk('cj'+k,`Quelle est la version sans alcool du <em>${k}</em> ?`,d.nom,CKT.filter(x=>x.nom!==d.nom&&x.nom!==k).map(x=>x.nom),d,'Cocktails')},
  vin(){return wineQ(pick(VINS.questions))},
  lexique(){return lexQ(pick(VINS.lexique))},
  cktNotes(){const d=pick(CKT);return mk('cn'+d.id,`Quel cocktail a ces notes gustatives ?`,d.nom,CKT.filter(x=>x.notes!==d.notes).map(x=>x.nom),d,'Cocktails',d.notes)},
};
function wineQ(x){const i=VINS.questions.indexOf(x);return mk('w'+i,esc(x.q),x.a,x.d,{wine:true,m:x.m,e:x.e},'Vins · '+WMOD[x.m])}
function lexQ(t){return mk('lx'+t.mot,'Quel terme correspond à cette définition ?',t.mot,VINS.lexique.map(x=>x.mot),{wine:true,m:'lexique',e:t.mot+' : '+t.def_},'Vins · Lexique',t.def_)}
function moduleTheme(m){const qs=VINS.questions.filter(x=>x.m===m);
  return {id:'w-'+m,name:'Vins · '+WMOD[m],n:m==='lexique'?10:Math.min(10,qs.length),gen:m==='lexique'?()=>lexQ(pick(VINS.lexique)):()=>wineQ(pick(qs))}}
const THEMES = [
  {id:'allerg',name:'Allergènes',sub:'Ce que chaque plat contient',b:['allergListe','allergListe','allergPresent','platAvec','platSans']},
  {id:'prix',name:'Prix',sub:'Food et cocktails',b:['prixFood','prixFood','prixFood','prixCkt']},
  {id:'compo',name:'Compositions',sub:'Descriptions, grammages, mise en place',b:['descToNom','descToNom','grammage','mep']},
  {id:'ckt',name:'Cocktails',sub:'Recettes, verres, garnish',b:['cktIngr','cktIngr','cktVerre','cktGarnish','cktMethode','cktGlace','cktSans','cktJumeau','cktNotes']},
  {id:'vins',name:'Vins',sub:'Régions, cépages, service, lexique',wide:true,b:['vin','vin','vin','lexique']},
  {id:'all',name:'Tout mélanger',sub:'10 questions sur toute la carte',wide:true,b:['allergListe','allergListe','allergPresent','platAvec','platSans','prixFood','prixFood','descToNom','grammage','mep','prixCkt','cktIngr','cktVerre','cktJumeau','cktSans']},
];
function buildQuiz(theme,n=theme.n||10){const out=[],seen=new Set();let tries=0;
  while(out.length<n&&tries<500){tries++;const q=theme.gen?theme.gen():B[pick(theme.b)]();if(q&&!seen.has(q.key)){seen.add(q.key);out.push(q)}}return out}

// ---------- jeu : XP, série de jours, objectif du jour ----------
const GOAL=50, ICONS={allerg:'⚠️',prix:'💶',compo:'🍽️',ckt:'🍸',vins:'🍷',all:'🎲'};
const today=()=>new Date().toLocaleDateString('sv');
function game(){const g=store.get('mb-game',{xp:0,days:{},streak:0,last:''});return g}
function streakNow(g){if(!g.last)return 0;const d=(new Date(today())-new Date(g.last))/864e5;return d<=1?g.streak:0}
function addXP(n){const g=game(),t=today();g.xp+=n;g.days[t]=(g.days[t]||0)+n;
  if(g.last!==t){const d=g.last?(new Date(t)-new Date(g.last))/864e5:99;g.streak=d===1?g.streak+1:1;g.last=t}
  const keep=Object.keys(g.days).sort().slice(-30);g.days=Object.fromEntries(keep.map(k=>[k,g.days[k]]));store.set('mb-game',g);renderGame();if(window.cloudSave)cloudSave();return g}
function renderGame(){const g=game(),x=g.days[today()]||0,s=streakNow(g);$('#xp').textContent=g.xp;$('#streak').textContent=s;
  $('#goal').innerHTML=`<div class="row" style="justify-content:space-between"><b>Objectif du jour</b><span class="meta" style="flex:0 0 auto">${Math.min(x,GOAL)} / ${GOAL} XP</span></div><div class="progress"><i style="width:${Math.min(100,x/GOAL*100)}%"></i></div>`;
  const n=playerName();$('#hi').textContent=!n?"Salut ! Moi c'est Bouchon. Dis-moi ton prénom et on révise la carte.":x>=GOAL?`Objectif atteint, ${n} ! Tu peux encore t'entraîner.`:s>1?`${n}, ${s} jours d'affilée ! On garde la série ?`:`Salut ${n} ! Un petit quiz pour gagner tes XP du jour ?`}
const bestPct=name=>Math.max(-1,...(window._att||localAttempts()).filter(a=>a.theme===name).map(a=>a.pct));
const stars=p=>p<0?'<span>Nouveau</span>':`<span class="stars">${'★'.repeat(Math.round(p/20))}${'☆'.repeat(5-Math.round(p/20))}</span>`;

// ---------- quiz flow ----------
let state=null;
function renderThemes(){$('#themes').innerHTML=THEMES.map(t=>`<button class="theme${t.wide?' wide':''}" data-t="${t.id}"><div class="ic">${ICONS[t.id]||'⭐'}</div><b>${t.name}</b>${t.wide?`<span>${t.sub}</span>`:stars(bestPct(t.name))}</button>`).join('');
  $('#themes').onclick=e=>{const b=e.target.closest('[data-t]');if(b)start(THEMES.find(t=>t.id===b.dataset.t))}}
function start(theme){if(!playerName()){ $('#name').focus(); $('#whoNote').textContent='Entre ton prénom pour commencer.'; return }
  state={theme,qs:buildQuiz(theme),i:0,good:0,wrong:[],xp:0};$('#home').hidden=true;$('#tabs').hidden=true;$('#play').hidden=false;showQ();window.scrollTo(0,0)}
function fiche(d){
  if(d.wine) return `<div>${esc(d.e)}</div><div class="meta">À revoir dans Apprendre › ${esc(WMOD[d.m])}</div>`;
  if(d.ingredients) return `<div><b>${esc(d.nom)}</b> · ${esc(d.prix)}${d.alcool?'':' · sans alcool'}</div><div>${d.ingredients.map(esc).join(' · ')}</div><div class="meta">Verre ${esc(d.verre)} · ${esc(d.glace)} · ${esc(d.methode)} · Garnish ${esc(d.garnish)}</div>`;
  return `<div><b>${esc(d.nom)}</b> · ${esc(d.prix)}${d.poids?' · '+esc(d.poids):''}</div><div>${esc(d.compo)}</div><div class="chips">${d.allergenes.length?d.allergenes.map(a=>`<span class="chip">${esc(a)}</span>`).join(''):'<span class="chip">Aucun allergène majeur</span>'}</div>`}
function showQ(){const s=state,q=s.qs[s.i];
  $('#play').innerHTML=`<div class="qbar"><button class="x" id="quit" aria-label="Quitter">✕</button><div class="progress"><i style="width:${s.i/s.qs.length*100}%"></i></div><span class="meta" style="font-weight:900">${s.i+1}/${s.qs.length}</span></div>
  <span class="eyebrow">${q.kind.startsWith(s.theme.name)||s.theme.name==='Cocktails'?esc(q.kind):esc(s.theme.name)+' · '+esc(q.kind)}</span>
  <div class="q">${q.q}</div>${q.quote?`<div class="quote">${esc(q.quote)}</div>`:''}
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>
  <div id="after"></div>`;
  $('#quit').onclick=goHome;
  $('#play .opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;answer(q,q.opts[+b.dataset.k])}}
function answer(q,o){const ok=o===q.answer;if(ok)state.good++;else state.wrong.push({q:q.q.replace(/<[^>]+>/g,''),a:q.answer,you:o});
  document.querySelectorAll('#play .opt').forEach(b=>{b.disabled=true;const v=q.opts[+b.dataset.k];if(v===q.answer)b.classList.add('ok');else if(v===o)b.classList.add('ko')});
  const last=state.i===state.qs.length-1;
  if(ok){state.xp+=10}
  const cheers=['Bravo !','Excellent !','Parfait !','Bien joué !','Exactement !'],oups=['Pas tout à fait…','Presque !','Oups…'];
  $('#after').innerHTML=`<div style="height:220px"></div><div class="sheet ${ok?'good':'bad'}" role="status"><div class="t"><svg class="pop" width="48" height="56" aria-hidden="true"><use href="#${ok?'bouchon':'bouchon-oups'}"/></svg>${ok?pick(cheers)+' <span style="font-size:15px">+10 XP</span>':pick(oups)}</div>
  <div class="fx">${ok?'':`<div><b>Bonne réponse : ${esc(q.answer)}</b></div>`}${fiche(q.item)}</div>
  <button class="btn ${ok?'good':'bad'}" id="next">${last?'Voir mon score':'Continuer'}</button></div>`;
  if(navigator.vibrate)navigator.vibrate(ok?15:[30,40,30]);
  $('#next').onclick=()=>{if(last)finish();else{state.i++;showQ();window.scrollTo(0,0)}};$('#next').focus({preventScroll:true})}
function finish(){const s=state,pct=Math.round(s.good/s.qs.length*100);
  const att={theme:s.theme.name,score:s.good,total:s.qs.length,pct,date:new Date().toISOString(),errors:s.wrong.slice(0,10)};
  saveAttempt(att);if(s.theme.mod){const L=learnState();L[s.theme.mod]={...(L[s.theme.mod]||{}),best:Math.max(pct,(L[s.theme.mod]||{}).best||0)};store.set('mb-learn',L)}
  const bonus=pct===100?20:pct>=80?10:0;const g=addXP(s.xp+bonus+5);
  $('#play').innerHTML=`<div class="done"><svg class="hop" width="140" height="164" aria-hidden="true"><use href="#${pct>=50?'bouchon':'bouchon-oups'}"/></svg>
  <p class="big">${pct===100?'Sans faute !':pct>=80?'Quiz réussi !':pct>=50?'Pas mal !':'On s\'accroche !'}</p>
  <div class="meta" style="font-size:15px">${esc(s.theme.name)} · ${pct>=80?'Tu maîtrises.':pct>=50?'Encore un tour et c\'est parfait.':(s.theme.mod?'Relis la leçon puis réessaie.':'Revois les fiches puis réessaie.')}</div>
  <div class="cards3"><div class="c3"><div>XP</div><div>💎 ${s.xp+bonus+5}</div></div><div class="c3 g"><div>Score</div><div>${s.good}/${s.qs.length}</div></div><div class="c3"><div>Série</div><div>🔥 ${streakNow(g)}</div></div></div></div>
  ${s.wrong.length?`<div class="panel"><h2>À revoir</h2>${s.wrong.map(w=>`<div class="fiche"><p>${esc(w.q)}</p><p class="meta">Ta réponse : ${esc(w.you)}</p><p><b>${esc(w.a)}</b></p></div>`).join('')}</div>`:''}
  <div style="display:grid;gap:14px"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="back">Autre quiz</button></div>`;
  $('#again').onclick=()=>start(s.theme);$('#back').onclick=goHome;window.scrollTo(0,0)}
function goHome(){$('#play').hidden=true;$('#home').hidden=false;$('#tabs').hidden=false;renderMine();renderThemes();renderGame();window.scrollTo(0,0)}

// ---------- player + results ----------
let db=null,user=null,uid=null,writing=Promise.resolve();
const playerName=()=>store.get('mb-name','')||(state&&state.name)||window._name||'';
function setName(){const v=$('#name').value.trim();if(!v)return;window._name=v;store.set('mb-name',v);$('#whoNote').textContent=`C'est noté, ${v}.`;$('#who').hidden=true;renderGame();if(db&&uid)pushMine()}
$('#saveName').onclick=setName;$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')setName()});$('#name').addEventListener('change',setName);
function localAttempts(){return store.get('mb-attempts',[])}
function saveAttempt(att){if(typeof sendSheet==='function')sendSheet(att);const l=[att,...localAttempts()].slice(0,50);store.set('mb-attempts',l);window._att=l;if(window.cloudSave)cloudSave();if(db&&uid)pushMine()}
function pushMine(){const l=window._att||localAttempts();const name=playerName();
  writing=writing.then(()=>db.doc('results/'+uid).set({name,updated:new Date().toISOString(),attempts:l.slice(0,50)})).catch(()=>{})}
function renderMine(){const l=window._att||localAttempts();$('#mine').hidden=!l.length;
  $('#mineList').innerHTML=l.slice(0,5).map(a=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><span>${esc(a.theme)}</span><span class="meta" style="flex:0 0 auto">${new Date(a.date).toLocaleDateString('fr-FR')}</span><span class="pill ${a.pct>=80?'g':a.pct>=50?'m':'r'}" style="flex:0 0 auto">${a.score}/${a.total}</span></div>`).join('')}

// ---------- apprendre ----------
const learnState=()=>store.get('mb-learn',{});
const LEARN=[
  {g:'La carte',items:[{id:'fc-food',t:'Cartes mémo : plats',s:FOOD.length+' plats, prix et allergènes',kind:'flash'},{id:'fc-ckt',t:'Cartes mémo : cocktails',s:CKT.length+' cocktails, recettes et service',kind:'flash'}]},
  {g:'Les vins',items:[...VINS.modules.map(m=>({id:m.id,t:m.titre,s:m.sous,kind:'lesson'})),
    {id:'cepages',t:'Cépages',s:'Les 7 grands cépages et leurs arômes',kind:'lesson'},
    {id:'service',t:'Service du vin',s:'Températures, carafe, formats, bouchons',kind:'lesson'},
    {id:'degust',t:'Dégustation',s:'Œil, nez, bouche, familles d\'arômes',kind:'lesson'},
    {id:'lexique',t:'Lexique',s:VINS.lexique.length+' mots pour parler du vin',kind:'flash'}]}];
function renderLearn(){const L=learnState();
  $('#v-learn').innerHTML=`<div class="hello"><svg width="70" height="82" aria-hidden="true"><use href="#bouchon"/></svg><div class="bubble">Lis une leçon, puis teste-toi. Les cartes mémo, c'est parfait avant le service.</div></div>`+LEARN.map(g=>`<h2>${g.g}</h2><div class="mods">${g.items.map(it=>{const st=L[it.id]||{};
    const tag=st.best!=null?`<span class="pill ${st.best>=80?'g':st.best>=50?'m':'r'} st">${st.best} %</span>`:st.read?'<span class="pill m st">Lu</span>':'';
    return `<button class="mod" data-id="${it.id}" data-k="${it.kind}"><span class="ic">${it.kind==='flash'?'🃏':'📖'}</span><div><b>${esc(it.t)}</b><span>${esc(it.s)}</span></div>${tag}</button>`}).join('')}</div>`).join('');
  $('#v-learn').onclick=e=>{const b=e.target.closest('.mod');if(!b)return;b.dataset.k==='flash'?openFlash(b.dataset.id):openLesson(b.dataset.id)};window.scrollTo(0,0)}
function sectionsFor(id){if(id==='cepages')return VINS.cepages.map(c=>({t:c.nom+' · '+c.couleur,l:['Origine : '+c.origine,'Où : '+c.aires,'Arômes : '+c.aromes]}));
  if(id==='service')return VINS.service;if(id==='degust')return VINS.degust;return VINS.modules.find(m=>m.id===id).sections}
function openLesson(id){const secs=sectionsFor(id);const n=VINS.questions.filter(x=>x.m===id).length;
  const L=learnState();L[id]={...(L[id]||{}),read:true};store.set('mb-learn',L);
  $('#v-learn').innerHTML=`<button class="backbtn" id="lback">‹ Apprendre</button><h2 style="font-size:22px">${esc(WMOD[id])}</h2>
  ${secs.map(s=>`<div class="panel lesson"><h3>${esc(s.t)}</h3>${s.p?`<p>${esc(s.p)}</p>`:''}${s.l?`<ul>${s.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}
  ${n?`<button class="btn" id="ltest" style="width:100%">Je m'entraîne (${Math.min(10,n)} questions)</button>`:''}`;
  $('#lback').onclick=renderLearn;if(n)$('#ltest').onclick=()=>startModule(id);window.scrollTo(0,0)}
function startModule(id){document.querySelector('#tabs [data-v=quiz]').click();const t=moduleTheme(id);t.mod=id;start(t)}
let deck=null;
function openFlash(id){let cards;
  if(id==='fc-food')cards=FOOD.map(d=>({f:d.nom,sub:d.cat,b:`<p><b>${esc(d.prix)}</b>${d.poids?' · '+esc(d.poids):''}</p><p>${esc(d.compo)}</p><p class="meta">Allergènes : ${esc(allergTxt(d.allergenes))}</p>`}));
  else if(id==='fc-ckt')cards=CKT.map(d=>({f:d.nom,sub:d.alcool?'Cocktail':'Sans alcool',b:`<p><b>${esc(d.prix)}</b></p><p>${d.ingredients.map(esc).join(' · ')}</p><p class="meta">${esc(d.verre)} · ${esc(d.glace)} · ${esc(d.methode)} · Garnish ${esc(d.garnish)}</p>`}));
  else cards=VINS.lexique.map(t=>({f:t.mot,sub:'Que veut dire ce mot ?',b:`<p>${esc(t.def_)}</p>`}));
  deck={id,todo:shuffle(cards),known:0,total:cards.length,front:true};showCard()}
function showCard(){const v=$('#v-learn');const c=deck.todo[0];
  if(!c){const L=learnState();L[deck.id]={...(L[deck.id]||{}),read:true};store.set('mb-learn',L);
    addXP(10);v.innerHTML=`<button class="backbtn" id="lback">‹ Apprendre</button><div class="done"><svg class="hop" width="120" height="140" aria-hidden="true"><use href="#bouchon"/></svg><p class="big">Paquet terminé !</p><div class="meta">${deck.total} cartes acquises · +10 XP</div></div><div class="row"><button class="btn" id="again">Recommencer</button>${deck.id==='lexique'?'<button class="btn ghost" id="lq">Quiz lexique</button>':''}</div>`;
    $('#lback').onclick=renderLearn;$('#again').onclick=()=>openFlash(deck.id);if(deck.id==='lexique')$('#lq').onclick=()=>startModule('lexique');return}
  v.innerHTML=`<button class="backbtn" id="lback">‹ Apprendre</button>
  <div class="row" style="justify-content:space-between"><span class="eyebrow">Cartes mémo</span><span class="eyebrow" style="flex:0 0 auto">${deck.known} / ${deck.total} acquises</span></div>
  <div class="progress"><i style="width:${deck.known/deck.total*100}%;background:var(--ok)"></i></div>
  <button class="flash" id="card">${deck.front?`<span class="eyebrow">${esc(c.sub)}</span><div class="big">${esc(c.f)}</div><div class="hint">Touchez pour voir la réponse</div>`:`<div class="big" style="font-size:18px">${esc(c.f)}</div>${c.b}`}</button>
  ${deck.front?'':`<div class="row"><button class="btn bad" id="again2">À revoir</button><button class="btn good" id="ok">Je savais</button></div>`}`;
  $('#lback').onclick=renderLearn;$('#card').onclick=()=>{deck.front=!deck.front;showCard()};
  if(!deck.front){$('#ok').onclick=()=>{deck.todo.shift();deck.known++;deck.front=true;showCard()};
    $('#again2').onclick=()=>{const x=deck.todo.shift();deck.todo.splice(Math.min(3,deck.todo.length),0,x);deck.front=true;showCard()}}}

// ---------- fiches ----------
let ff='Tous';
function renderFiches(){const cats=['Tous','Appetizers','Entrées','Cru','Plats','Garnitures','Desserts','Cocktails'];
  $('#ffil').innerHTML=cats.map(c=>`<button aria-pressed="${c===ff}" data-c="${c}">${c}</button>`).join('');
  const q=$('#search').value.trim().toLowerCase();
  const items=[...FOOD.map(d=>({d,g:group(d)})),...CKT.map(d=>({d,g:'Cocktails'}))].filter(x=>(ff==='Tous'||x.g===ff)&&(!q||JSON.stringify(x.d).toLowerCase().includes(q)));
  $('#ficheList').innerHTML=items.length?items.map(({d})=>d.ingredients?
    `<div class="fiche"><h3>${esc(d.nom)}${d.alcool?'':' (sans alcool)'}<span>${esc(d.prix)}</span></h3><p>${d.ingredients.map(esc).join(' · ')}</p><p class="meta">${esc(d.verre)} · ${esc(d.glace)} · ${esc(d.methode)} · Garnish ${esc(d.garnish)}</p><p class="meta">${esc(d.notes)}</p><p class="meta">${esc(d.details)}</p></div>`:
    `<div class="fiche"><span class="eyebrow">${esc(d.cat)}</span><h3>${esc(d.nom)}<span>${esc(d.prix)}</span></h3><p>${esc(d.compo)}</p>${d.poids?`<p class="meta">Grammage ${esc(d.poids)}</p>`:''}<div class="chips">${d.allergenes.length?d.allergenes.map(a=>`<span class="chip">${esc(a)}</span>`).join(''):'<span class="chip">Aucun allergène majeur</span>'}</div>${d.mep?`<p class="meta">Mise en place : ${esc(d.mep)}</p>`:''}</div>`).join(''):'<p class="note">Aucun résultat.</p>'}
$('#ffil').onclick=e=>{const b=e.target.closest('[data-c]');if(b){ff=b.dataset.c;renderFiches()}};$('#search').oninput=renderFiches;

// ---------- suivi (managers) ----------
let team=[];
function renderSuivi(){if(!team.length){$('#suiviBody').innerHTML='<p class="note">Aucun score enregistré pour l\'instant. Les résultats apparaîtront ici dès que l\'équipe aura fait un quiz.</p>';return}
  const rows=team.map(t=>{const a=t.attempts||[];const avg=a.length?Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length):0;
    const by={};a.forEach(x=>{(by[x.theme]=by[x.theme]||[]).push(x.pct)});
    const weak=Object.entries(by).map(([k,v])=>[k,v.reduce((s,x)=>s+x,0)/v.length]).sort((x,y)=>x[1]-y[1])[0];
    return {...t,n:a.length,avg,last:a[0],weak:weak&&weak[1]<80?weak[0]:'—'}}).sort((x,y)=>(y.updated||'').localeCompare(x.updated||''));
  $('#suiviBody').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Prénom</th><th>Quiz</th><th>Moyenne</th><th>Dernier</th><th>À travailler</th></tr></thead><tbody>${rows.map((r,i)=>`<tr data-i="${i}" style="cursor:pointer"><td><b>${esc(r.name||'?')}</b></td><td>${r.n}</td><td><span class="pill ${r.avg>=80?'g':r.avg>=50?'m':'r'}">${r.avg} %</span></td><td>${r.last?new Date(r.last.date).toLocaleDateString('fr-FR'):'—'}</td><td>${esc(r.weak)}</td></tr>`).join('')}</tbody></table></div><p class="note">Touchez une ligne pour voir le détail.</p>`;
  $('#suiviBody tbody').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;const r=rows[+tr.dataset.i];const p=$('#suiviDetail');p.hidden=false;
    p.innerHTML=`<h2>${esc(r.name)}</h2>${(r.attempts||[]).slice(0,20).map(a=>`<div class="fiche"><div class="row" style="justify-content:space-between"><span>${esc(a.theme)}</span><span class="meta" style="flex:0 0 auto">${new Date(a.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</span><span class="pill ${a.pct>=80?'g':a.pct>=50?'m':'r'}" style="flex:0 0 auto">${a.score}/${a.total}</span></div>${(a.errors||[]).map(w=>`<p class="meta">✗ ${esc(w.q)} → <b>${esc(w.a)}</b></p>`).join('')}</div>`).join('')}`;p.scrollIntoView({behavior:'smooth'})}}

// ---------- tabs ----------
$('#tabs').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-current',x===b));
  ['quiz','learn','fiches','suivi'].forEach(v=>$('#v-'+v).hidden=v!==b.dataset.v);
  if(b.dataset.v==='fiches')renderFiches();if(b.dataset.v==='learn')renderLearn();window.scrollTo(0,0)};

// ---------- boot ----------
const n0=store.get('mb-name','');if(n0){$('#name').value=n0;$('#who').hidden=true}
if(typeof RESTAURANT==='string')$('#resto').textContent=RESTAURANT;
renderThemes();renderMine();renderGame();
(async()=>{if(!window.claude?.use)return;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(user)uid=await user.id()}catch{}
  if(db&&uid){try{const s=await db.doc('results/'+uid).get();if(s.exists){const d=s.data();const loc=localAttempts();
      if((d.attempts||[]).length>loc.length){window._att=d.attempts;store.set('mb-attempts',d.attempts)}
      if(!playerName()&&d.name){window._name=d.name;$('#name').value=d.name;$('#whoNote').textContent=`Bonjour ${d.name}, choisis un quiz.`}
      renderMine()}}catch{}}
  const isMgr=user?await user.canEdit().catch(()=>false):false;
  if(db&&isMgr){$('#tabSuivi').hidden=false;
    db.collection('results').onSnapshot(s=>{team=s.docs.map(d=>d.data());renderSuivi()},()=>{$('#suiviBody').textContent='Le suivi n\'est pas accessible depuis cette vue.'})}
})();
</script>

<script>
// Connexion par e-mail + mot de passe (Firebase) et sauvegarde de la progression en ligne.
// Sans FIREBASE dans config.js, l'appli marche comme avant, en local sur le téléphone.
(function(){
const ON = typeof FIREBASE==='object' && FIREBASE && FIREBASE.apiKey && typeof firebase!=='undefined';
window.cloudSave=()=>{};
if(!ON) return;
firebase.initializeApp(FIREBASE);
const auth=firebase.auth(), fs=firebase.firestore();
if(FIREBASE.emulator){auth.useEmulator('http://localhost:9099',{disableWarnings:true});fs.useEmulator('localhost',8080)} // tests uniquement
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch{}
const ADMINS_=(typeof ADMINS!=='undefined'?ADMINS:[]).map(x=>x.toLowerCase());
const RESTOS=(typeof RESTAURANTS!=='undefined'&&RESTAURANTS.length)?RESTAURANTS:[RESTAURANT];
let me=null, profile=null, timer=null;

const MSG={'auth/invalid-email':"Cette adresse e-mail n'est pas valide.",'auth/email-already-in-use':'Un compte existe déjà avec cet e-mail. Connecte-toi.',
 'auth/weak-password':'Le mot de passe doit faire au moins 6 caractères.','auth/invalid-credential':'E-mail ou mot de passe incorrect.',
 'auth/wrong-password':'E-mail ou mot de passe incorrect.','auth/user-not-found':'Aucun compte avec cet e-mail.','auth/missing-password':'Entre ton mot de passe.',
 'auth/too-many-requests':'Trop d\'essais. Réessaie dans quelques minutes.','auth/network-request-failed':'Pas de connexion internet.'};
const err=e=>MSG[e&&e.code]||'Une erreur est survenue. Réessaie.';

// ---------- écran de connexion ----------
const box=document.createElement('div');box.id='login';box.hidden=true;document.body.appendChild(box);
let mode='in';
function drawLogin(note){
  box.innerHTML=`<div class="lwrap">
  <svg class="hop" width="120" height="140" aria-hidden="true"><use href="#bouchon"/></svg>
  <h2 style="font-size:26px;text-align:center">${mode==='in'?'Content de te revoir !':mode==='up'?'Crée ton compte':'Mot de passe oublié'}</h2>
  <p class="meta" style="text-align:center;margin:0">${mode==='reset'?'Entre ton e-mail, on t\'envoie un lien pour choisir un nouveau mot de passe.':'Révise la carte et garde ta progression sur tous tes appareils.'}</p>
  <form id="lform" style="display:grid;gap:12px;width:100%">
    ${mode==='up'?`<input type="text" id="lname" placeholder="Prénom" autocomplete="given-name" required>`:''}
    <input type="email" id="lmail" placeholder="E-mail" autocomplete="email" inputmode="email" required>
    ${mode!=='reset'?`<input type="password" id="lpass" placeholder="Mot de passe" autocomplete="${mode==='up'?'new-password':'current-password'}" required minlength="6">`:''}
    ${mode==='up'&&RESTOS.length>1?`<select id="lresto">${RESTOS.map(r=>`<option>${esc(r)}</option>`).join('')}</select>`:''}
    <div id="lnote" class="lnote" role="alert">${note||''}</div>
    <button class="btn" type="submit">${mode==='in'?'Se connecter':mode==='up'?'Créer mon compte':'Envoyer le lien'}</button>
  </form>
  ${mode==='in'?`<button class="lnk" data-m="reset">Mot de passe oublié ?</button><button class="btn ghost" data-m="up">Créer un compte</button>`:`<button class="btn ghost" data-m="in">J'ai déjà un compte</button>`}
  </div>`;
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;drawLogin()});
  box.querySelector('#lform').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;
    const mail=$('#lmail').value.trim(),pass=$('#lpass')?.value||'';const note=t=>{$('#lnote').textContent=t;btn.disabled=false};
    try{
      if(mode==='reset'){await auth.sendPasswordResetEmail(mail);mode='in';drawLogin('E-mail envoyé. Regarde ta boîte de réception (et les spams).');return}
      if(mode==='up'){const name=$('#lname').value.trim();if(!name)return note('Entre ton prénom.');
        profile={name,email:mail,restaurant:$('#lresto')?.value||RESTOS[0],created:new Date().toISOString()};
        store.set('mb-name',name);
        const c=await auth.createUserWithEmailAndPassword(mail,pass);
        await fs.doc('users/'+c.user.uid).set(profile,{merge:true}).catch(()=>{});
      } else await auth.signInWithEmailAndPassword(mail,pass);
    }catch(x){if(mode==='up')profile=null;note(err(x))}};
}
const css=document.createElement('style');css.textContent=`
#login{position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px 32px}
#login .lwrap{max-width:420px;margin:0 auto;display:grid;justify-items:center;gap:14px}
#login input,#login select{font:inherit;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
.lnote{min-height:1.2em;font-size:14px;color:var(--ko-ink);text-align:center}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font-weight:800;padding:4px}
#suiviBody{color:var(--ink);font-size:15px;min-width:0}#suiviBody .cards3{grid-template-columns:repeat(3,minmax(0,1fr))}#v-suivi,#v-suivi .panel,.table-wrap{min-width:0;max-width:100%}
#mebtn{background:var(--soft);border:2px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:15px;padding:0}
`;document.head.appendChild(css);

// ---------- profil (bouton rond dans l'en-tête) ----------
const mb=document.createElement('button');mb.id='mebtn';mb.setAttribute('aria-label','Mon compte');mb.hidden=true;
document.querySelector('header.top').appendChild(mb);
const acct=document.createElement('div');acct.className='panel';acct.hidden=true;$('#home').prepend(acct);
mb.onclick=()=>{goHome();const w=acct;w.hidden=false;
  w.innerHTML=`<span class="eyebrow">Mon compte</span><div><b>${esc(profile?.name||'')}</b></div><div class="meta">${esc(me.email)}<br>${esc(profile?.restaurant||'')}${profile?.role==='manager'?' · Manager':''}</div>
  <div class="row"><button class="btn ghost" id="mclose">Fermer</button><button class="btn bad" id="mout">Se déconnecter</button></div>`;
  $('#mclose').onclick=()=>{w.hidden=true};$('#mout').onclick=()=>{if(confirm('Se déconnecter ?'))auth.signOut()};window.scrollTo(0,0)};

// ---------- synchro ----------
const KEYS=['mb-attempts','mb-game','mb-learn'];
function snapshot(){return{attempts:store.get('mb-attempts',[]).slice(0,50),game:store.get('mb-game',null),learn:store.get('mb-learn',{}),updated:new Date().toISOString()}}
window.cloudSave=()=>{if(!me)return;clearTimeout(timer);timer=setTimeout(()=>{
  const g=store.get('mb-game',{});fs.doc('users/'+me.uid).set({...snapshot(),name:profile?.name||playerName(),xp:g.xp||0,restaurant:profile?.restaurant||RESTOS[0],email:me.email},{merge:true}).catch(()=>{})},800)};

auth.onAuthStateChanged(async u=>{
  me=u;
  if(!u){mode='in';acct.hidden=true;box.hidden=false;mb.hidden=true;$('#tabSuivi').hidden=true;drawLogin();return}
  box.hidden=true;
  let d={};try{const s=await fs.doc('users/'+u.uid).get();d=s.exists?s.data():{}}catch{}
  profile={...(profile||{}),...d};
  if(store.get('mb-uid','')!==u.uid){ // autre personne sur ce téléphone : on repart de son compte
    KEYS.forEach(k=>{try{localStorage.removeItem(k)}catch{}});store.set('mb-uid',u.uid);window._att=null}
  const loc=store.get('mb-attempts',[]);
  if((d.attempts||[]).length>=loc.length&&d.updated){store.set('mb-attempts',d.attempts||[]);if(d.game)store.set('mb-game',d.game);if(d.learn)store.set('mb-learn',d.learn);window._att=d.attempts||[]}
  else cloudSave();
  if(profile.name)store.set('mb-name',profile.name);
  if(profile.restaurant)$('#resto').textContent=profile.restaurant;
  $('#name').value=profile.name||'';$('#who').hidden=true;
  mb.hidden=false;mb.textContent=(profile.name||u.email||'?').trim()[0].toUpperCase();
  goHome();
  const admin=ADMINS_.includes((u.email||'').toLowerCase());
  if(admin||profile.role==='manager'){$('#tabSuivi').hidden=false;
    const q=admin?fs.collection('users'):fs.collection('users').where('restaurant','==',profile.restaurant);
    q.onSnapshot(s=>{team=s.docs.map(x=>({...x.data(),uid:x.id}));window._admin=admin;renderSuivi()},()=>{$('#suiviBody').textContent="Le suivi n'est pas accessible."})}
});

// ---------- espace manager ----------
window.renderSuivi=function(){
  const body=$('#suiviBody'),det=$('#suiviDetail');
  const ppl=team.filter(t=>t.uid!==me?.uid||(t.attempts||[]).length);
  if(!ppl.length){body.innerHTML='<p class="note">Personne n\'a encore créé de compte. Partage le lien de l\'appli à l\'équipe.</p>';return}
  const wk=Date.now()-7*864e5;
  const rows=ppl.map(t=>{const a=t.attempts||[];const avg=a.length?Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length):null;
    const by={};a.forEach(x=>{(by[x.theme]=by[x.theme]||[]).push(x.pct)});
    const weak=Object.entries(by).map(([k,v])=>[k,v.reduce((s,x)=>s+x,0)/v.length]).sort((x,y)=>x[1]-y[1])[0];
    return {...t,n:a.length,week:a.filter(x=>new Date(x.date)>wk).length,avg,last:a[0],streak:t.game?streakNow(t.game):0,weak:weak&&weak[1]<80?weak[0]:'—'}})
    .sort((x,y)=>(y.xp||0)-(x.xp||0));
  const restos=[...new Set(rows.map(r=>r.restaurant||''))];
  const actifs=rows.filter(r=>r.week).length, quizW=rows.reduce((s,r)=>s+r.week,0);
  const moy=rows.filter(r=>r.avg!=null);const avgAll=moy.length?Math.round(moy.reduce((s,r)=>s+r.avg,0)/moy.length):0;
  body.innerHTML=`<div class="cards3" style="margin-bottom:6px"><div class="c3"><div>Équipe</div><div>${rows.length}</div></div><div class="c3"><div>Actifs 7 j</div><div>${actifs}</div></div><div class="c3 g"><div>Moyenne</div><div>${avgAll} %</div></div></div>
  <p class="note" style="margin:0 0 6px">${quizW} quiz faits cette semaine. Classement par XP.</p>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>Prénom</th>${restos.length>1?'<th>Restaurant</th>':''}<th>XP</th><th>🔥</th><th>Moy.</th><th>Dernier quiz</th><th>À travailler</th></tr></thead><tbody>${rows.map((r,i)=>`<tr data-i="${i}" style="cursor:pointer"><td>${i+1}</td><td><b>${esc(r.name||'?')}</b>${r.role==='manager'?' <span class="pill m">Manager</span>':''}</td>${restos.length>1?`<td>${esc(r.restaurant||'')}</td>`:''}<td>${r.xp||0}</td><td>${r.streak}</td><td>${r.avg==null?'—':`<span class="pill ${r.avg>=80?'g':r.avg>=50?'m':'r'}">${r.avg} %</span>`}</td><td>${r.last?new Date(r.last.date).toLocaleDateString('fr-FR'):'—'}</td><td>${esc(r.weak)}</td></tr>`).join('')}</tbody></table></div><p class="note">Touche une ligne pour voir le détail.</p>`;
  $('#suiviBody tbody').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;const r=rows[+tr.dataset.i];det.hidden=false;
    det.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(r.name||'?')}</h2><span class="meta" style="flex:0 0 auto">${esc(r.email||'')}</span></div>
    <div class="meta">${esc(r.restaurant||'')} · ${r.n} quiz · 💎 ${r.xp||0} XP · 🔥 ${r.streak}</div>
    ${window._admin&&r.uid!==me.uid?`<button class="btn ghost" id="role">${r.role==='manager'?'Retirer le rôle manager':'Nommer manager'}</button>`:''}
    ${(r.attempts||[]).slice(0,20).map(a=>`<div class="fiche"><div class="row" style="justify-content:space-between"><span>${esc(a.theme)}</span><span class="meta" style="flex:0 0 auto">${new Date(a.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</span><span class="pill ${a.pct>=80?'g':a.pct>=50?'m':'r'}" style="flex:0 0 auto">${a.score}/${a.total}</span></div>${(a.errors||[]).map(w=>`<p class="meta">✗ ${esc(w.q)} → <b>${esc(w.a)}</b></p>`).join('')}</div>`).join('')||'<p class="note">Pas encore de quiz.</p>'}`;
    const rb=$('#role');if(rb)rb.onclick=async()=>{rb.disabled=true;try{await fs.doc('users/'+r.uid).set({role:r.role==='manager'?'':'manager'},{merge:true})}catch{alert('Modification refusée.')}};
    det.scrollIntoView({behavior:'smooth'})}};
})();

</script>
</body></html>
